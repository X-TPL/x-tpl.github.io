<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="940" height="395">
  <defs>
    <linearGradient id="rnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="mauiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="fltGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="corGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="940" height="395" fill="#ffffff" rx="12" />

  <!-- Title & Subtitle -->
  <text x="40" y="42" font-family="Inter, sans-serif" font-size="19" font-weight="800" fill="#0f172a">Compiled Applications &amp; Compiled Binaries (APKs) Across Cross-Platform Frameworks</text>
  <text x="40" y="66" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748b">Compiled Binaries (APKs): 37,739 | Compiled Applications: 5,345 | Unique TPL-Version Pairs: 78,593 (15,236 Unique TPLs)</text>

  <!-- Left Panel: Compiled Apps per Framework -->
  <rect x="35" y="88" width="425" height="285" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="55" y="116" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Compiled Applications (N = 5,345)</text>

  <!-- RN Apps: 3,968 (74.2%) -->
  <text x="55" y="152" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">React Native</text>
  <text x="440" y="152" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#0284c7" text-anchor="end">3,968 apps (74.2%)</text>
  <rect x="55" y="160" width="385" height="18" rx="4" fill="#e2e8f0"/>
  <rect x="55" y="160" width="286" height="18" rx="4" fill="url(#rnGrad)"/>

  <!-- MAUI Apps: 1,027 (19.2%) -->
  <text x="55" y="206" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">.NET MAUI</text>
  <text x="440" y="206" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="end">1,027 apps (19.2%)</text>
  <rect x="55" y="214" width="385" height="18" rx="4" fill="#e2e8f0"/>
  <rect x="55" y="214" width="74" height="18" rx="4" fill="url(#mauiGrad)"/>

  <!-- Flutter Apps: 248 (4.6%) -->
  <text x="55" y="260" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Flutter</text>
  <text x="440" y="260" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#0369a1" text-anchor="end">248 apps (4.6%)</text>
  <rect x="55" y="268" width="385" height="18" rx="4" fill="#e2e8f0"/>
  <rect x="55" y="268" width="20" height="18" rx="4" fill="url(#fltGrad)"/>

  <!-- Cordova Apps: 102 (1.9%) -->
  <text x="55" y="314" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Apache Cordova</text>
  <text x="440" y="314" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#d97706" text-anchor="end">102 apps (1.9%)</text>
  <rect x="55" y="322" width="385" height="18" rx="4" fill="#e2e8f0"/>
  <rect x="55" y="322" width="10" height="18" rx="4" fill="url(#corGrad)"/>

  <!-- Right Panel: Compiled APK Files per Framework -->
  <rect x="480" y="88" width="425" height="285" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="116" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Compiled Binaries / APKs (N = 37,739)</text>

  <!-- RN APKs: 19,303 (51.1%) -->
  <text x="500" y="152" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">React Native</text>
  <text x="885" y="152" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#0284c7" text-anchor="end">19,303 APKs (51.1%)</text>
  <rect x="500" y="160" width="385" height="18" rx="4" fill="#e2e8f0"/>
  <rect x="500" y="160" width="197" height="18" rx="4" fill="url(#rnGrad)"/>

  <!-- MAUI APKs: 15,410 (40.8%) -->
  <text x="500" y="206" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">.NET MAUI</text>
  <text x="885" y="206" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="end">15,410 APKs (40.8%)</text>
  <rect x="500" y="214" width="385" height="18" rx="4" fill="#e2e8f0"/>
  <rect x="500" y="214" width="157" height="18" rx="4" fill="url(#mauiGrad)"/>

  <!-- Flutter APKs: 2,414 (6.4%) -->
  <text x="500" y="260" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Flutter</text>
  <text x="885" y="260" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#0369a1" text-anchor="end">2,414 APKs (6.4%)</text>
  <rect x="500" y="268" width="385" height="18" rx="4" fill="#e2e8f0"/>
  <rect x="500" y="268" width="25" height="18" rx="4" fill="url(#fltGrad)"/>

  <!-- Cordova APKs: 612 (1.6%) -->
  <text x="500" y="314" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Apache Cordova</text>
  <text x="885" y="314" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#d97706" text-anchor="end">612 APKs (1.6%)</text>
  <rect x="500" y="322" width="385" height="18" rx="4" fill="#e2e8f0"/>
  <rect x="500" y="322" width="8" height="18" rx="4" fill="url(#corGrad)"/>
</svg>