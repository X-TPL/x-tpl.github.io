<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="100%" height="100%">
  <rect width="940" height="310" fill="#ffffff" rx="12" />

  <!-- Title -->
  <text x="40" y="40" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Overview of the System to Build the X-TPL Dataset</text>
  <text x="40" y="62" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">Four phases: crawling (57,993 repos), downloading (54,953 buildable), analysing, and building (37,739 APKs &amp; 78,593 TPL-version pairs)</text>

  <!-- Step 1: Crawler -->
  <rect x="30" y="88" width="195" height="185" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="88" width="195" height="34" rx="10" fill="#1e293b"/>
  <text x="127" y="110" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">① Crawler</text>
  <text x="127" y="145" font-family="JetBrains Mono, monospace" font-size="16" font-weight="800" fill="#2563eb" text-anchor="middle">57,993 Repos</text>
  <text x="127" y="165" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">GitHub API (PyGithub)</text>
  <line x1="50" y1="178" x2="205" y2="178" stroke="#e2e8f0" stroke-width="1"/>
  <text x="127" y="198" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">54,953 Buildable</text>
  <text x="127" y="215" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Tagged buildable (94.8%)</text>
  <text x="127" y="232" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Latest release / default branch</text>
  <text x="127" y="252" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Metadata: repos.json</text>

  <!-- Arrow 1->2 -->
  <path d="M230 180 L250 180" stroke="#64748b" stroke-width="2"/>
  <polygon points="247,175 255,180 247,185" fill="#64748b"/>

  <!-- Step 2: Downloader -->
  <rect x="260" y="88" width="195" height="185" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="260" y="88" width="195" height="34" rx="10" fill="#0f766e"/>
  <text x="357" y="110" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">② Downloader</text>
  <text x="357" y="145" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#0f766e" text-anchor="middle">GitHub ZIP API</text>
  <text x="357" y="165" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Retrieves Buildable Repos</text>
  <line x1="280" y1="178" x2="435" y2="178" stroke="#e2e8f0" stroke-width="1"/>
  <text x="357" y="198" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Archive Extraction:</text>
  <text x="357" y="215" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">• Unique repo folder names</text>
  <text x="357" y="232" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">• Prevents directory collisions</text>
  <text x="357" y="252" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">• Ready for static validation</text>

  <!-- Arrow 2->3 -->
  <path d="M460 180 L480 180" stroke="#64748b" stroke-width="2"/>
  <polygon points="477,175 485,180 477,185" fill="#64748b"/>

  <!-- Step 3: Analyzer -->
  <rect x="490" y="88" width="195" height="185" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="490" y="88" width="195" height="34" rx="10" fill="#1d4ed8"/>
  <text x="587" y="110" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">③ Analyzer</text>
  <text x="587" y="145" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Static Validation</text>
  <text x="587" y="165" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Topmost Valid Build Dir</text>
  <line x1="510" y1="178" x2="665" y2="178" stroke="#e2e8f0" stroke-width="1"/>
  <text x="587" y="198" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Conservative Version Est.:</text>
  <text x="587" y="215" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">• Framework (e.g., Flutter)</text>
  <text x="587" y="232" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">• Engine (Gradle) &amp; JDK</text>
  <text x="587" y="252" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">• Filters private dependencies</text>

  <!-- Arrow 3->4 -->
  <path d="M690 180 L710 180" stroke="#64748b" stroke-width="2"/>
  <polygon points="707,175 715,180 707,185" fill="#64748b"/>

  <!-- Step 4: Orchestrator -->
  <rect x="720" y="88" width="190" height="185" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="720" y="88" width="190" height="34" rx="10" fill="#4338ca"/>
  <text x="815" y="110" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">④ Orchestrator</text>
  <text x="815" y="143" font-family="JetBrains Mono, monospace" font-size="15.5" font-weight="800" fill="#4338ca" text-anchor="middle">37,739 APKs</text>
  <text x="815" y="162" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">78,593 TPL-Ver. Pairs</text>
  <line x1="740" y1="174" x2="890" y2="174" stroke="#e2e8f0" stroke-width="1"/>
  <text x="815" y="193" font-family="Inter, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">• 5,345 Compiled Apps</text>
  <text x="815" y="210" font-family="Inter, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">• 15,236 Unique TPL Names</text>
  <text x="815" y="227" font-family="Inter, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">• Debug, Release (R8) &amp; Obf.</text>
  <text x="815" y="248" font-family="JetBrains Mono, monospace" font-size="10" fill="#6366f1" text-anchor="middle">Lock files + .jar/.aar libs</text>
</svg>